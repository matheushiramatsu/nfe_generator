name: Quality checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nfe_lab
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: nfe_lab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nfe_lab"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://nfe_lab:ci_test_password@localhost:5432/nfe_lab
      - run: python scripts/postgres_smoke.py
        env:
          DATABASE_URL: postgresql+psycopg://nfe_lab:ci_test_password@localhost:5432/nfe_lab
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build

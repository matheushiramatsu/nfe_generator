services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nfe_lab
      POSTGRES_USER: nfe_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_homologation_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfe_lab -d nfe_lab"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://nfe_lab:${POSTGRES_PASSWORD:-local_homologation_only}@db:5432/nfe_lab
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      REQUESTS_PER_MINUTE: 240
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
